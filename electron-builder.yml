appId: com.wynterjones.nisaba
productName: Nisaba
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
# node-pty ships a .node binary and a spawn-helper that must be real files on disk.
asarUnpack:
  - "**/node_modules/node-pty/**"
publish:
  provider: github
  owner: WynterJones
  repo: Nisaba
mac:
  target: dmg
  category: public.app-category.productivity
win:
  target: nsis
linux:
  target: AppImage
  category: Utility
