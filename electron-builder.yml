appId: com.wynterjones.nisaba
productName: Nisaba
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
# node-pty ships a .node binary and a spawn-helper that must be real files on disk.
asarUnpack:
  - "**/node_modules/node-pty/**"
# The packer never uploads (every build runs with --publish never); this block exists so it
# writes app-update.yml into the bundle, which is what electron-updater reads at runtime.
# Uploading by hand means uploading dist/latest-mac.yml and the .zip files too, or the
# in-app updater has nothing to compare against.
publish:
  provider: github
  owner: WynterJones
  repo: Nisaba
# electron-builder suffixes only the non-default arch, which produced "Nisaba-1.0.0.dmg" for
# Intel and "Nisaba-1.0.0-arm64.dmg" for Apple Silicon -- the Intel one reads as the default
# download and silently runs under Rosetta on an M-series Mac. Always name the arch.
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  # zip as well as dmg: electron-updater installs from the zip, and cannot use a dmg.
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing happens here; notarization is `npm run notarize`, which submits the finished DMGs
  # with a notarytool keychain profile. That keeps the app-specific password out of the
  # environment and off every command line.
  notarize: false
win:
  target: nsis
linux:
  target: AppImage
  category: Utility
